<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chatroom</title>
  <link rel="stylesheet" href="style.css?v=3">
</head>

<body>

<!-- LOGIN -->
<div id="login" class="loginScreen">
  <h2>Enter Username</h2>
  <input id="username" placeholder="Username" maxlength="32" />
  <input id="color" type="color" value="#ff66ff" />
  <button onclick="enterChat()">Enter Chat</button>
  <p id="loginHint" class="loginHint hidden"></p>
</div>

<!-- CHAT -->
<div id="chat" class="chatLayout hidden">

  <!-- SIDE PANEL -->
  <div id="sidePanel">

    <div id="profile">
      <span id="profileName"></span>
      <button id="renameBtn" title="Change username" onclick="toggleRename()">✏️</button>
    </div>

    <div id="renameBox" class="hidden">
      <input id="renameInput" placeholder="New username" maxlength="32" />
      <label id="renameColorWrap">
        <input id="renameColor" type="color" title="Name colour" />
      </label>
      <button onclick="saveRename()">Save</button>
      <button onclick="toggleRename()">✕</button>
    </div>

    <h3>Online</h3>
    <div id="onlineList"></div>

    <h3>Emoticons</h3>
    <div id="emoticonList"></div>

    <h3>Reactions</h3>
    <div id="reactionList"></div>

    <h3>Theme</h3>
    <select id="themeSelect"></select>

    <h3>Server</h3>
    <select id="serverSelect"></select>

  </div>

  <!-- MAIN CHAT -->
  <div id="chatMain">

    <div id="messages"></div>
    <div id="typing"></div>

    <div id="replyBar" class="hidden">
      <span id="replyText"></span>
      <button onclick="clearReply()">✕</button>
    </div>

    <!-- INPUT BAR -->
    <div id="inputBar">

      <button class="iconBtn" type="button" onclick="toggleEmojiPicker()">😊</button>
      <button class="iconBtn" type="button" onclick="triggerImageUpload()">📷</button>
      <button class="iconBtn" type="button" onclick="toggleGifPicker()">GIF</button>

      <input id="messageInput" placeholder="Message..." maxlength="2000" />

      <button id="sendButton" type="button">Send</button>

      <!-- EMOJI POPUP -->
      <div id="emojiPicker" class="hidden">
        <div id="emojiPickerHeader">
          <input id="emojiSearch" placeholder="Search emoji..." maxlength="40" />
          <button type="button" onclick="toggleEmojiPicker()">✕</button>
        </div>
        <div id="emojiPickerBody"></div>
      </div>

    </div>

    <!-- GIF PANEL -->
    <div id="gifPicker" class="hidden">
      <input id="gifSearch" placeholder="Search GIFs..." maxlength="100" />
      <button type="button" onclick="searchGifs()">Search</button>
      <div id="gifResults"></div>
    </div>

    <input type="file" id="imageUpload" accept="image/*" class="hidden">

  </div>
</div>

<script src="script.js?v=3"></script>
</body>
</html>
