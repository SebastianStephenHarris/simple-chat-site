<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Simple Web Chat</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- LOGIN -->
<div id="login" class="loginScreen">
  <h2>Enter Username</h2>
  <input id="username" placeholder="Username" />
  <input id="color" type="color" value="#ff66ff" />
  <button onclick="enterChat()">Enter Chat</button>
</div>

<!-- CHAT -->
<div id="chat" class="chatLayout hidden">

  <!-- SIDE PANEL -->
  <div id="sidePanel">
    <h3>Emoji</h3>
    <div id="emojiList"></div>

    <h3>Emoticons</h3>
    <div id="emoticonList"></div>

    <h3>Reactions</h3>
    <div id="reactionList"></div>
  </div>

  <!-- MAIN CHAT -->
  <div id="chatMain">

    <div id="messages"></div>
    <div id="typing"></div>

    <div id="replyBar" class="hidden">
      <span id="replyText"></span>
      <button onclick="clearReply()">✕</button>
    </div>

    <!-- INPUT BAR -->
    <div id="inputBar">

      <button class="iconBtn" onclick="triggerImageUpload()">📷</button>
      <button class="iconBtn" onclick="toggleGifPicker()">GIF</button>

      <input id="messageInput" placeholder="Message..." />

      <button id="sendButton">Send</button>
    </div>

    <!-- GIF PANEL -->
    <div id="gifPicker" class="hidden">
      <input id="gifSearch" placeholder="Search GIFs..." />
      <button onclick="searchGifs()">Search</button>
      <div id="gifResults"></div>
    </div>

    <input type="file" id="imageUpload" accept="image/*" class="hidden">

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
